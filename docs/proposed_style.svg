<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- polygon with unified base color -->
  <polygon points="50,50 150,50 100,150" fill="#ccddee" stroke="#3388ff" stroke-width="2" fill-opacity="0.6"/>
  <!-- selection highlight with new scheme -->
  <polygon points="50,50 150,50 100,150" fill="none" stroke="#ff8800" stroke-width="4" stroke-dasharray="4,4"/>
  <!-- vertices larger and consistent -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" stroke="#3388ff" stroke-width="1"/>
  <circle cx="150" cy="50" r="4" fill="#ffffff" stroke="#3388ff" stroke-width="1"/>
  <circle cx="100" cy="150" r="4" fill="#ffffff" stroke="#3388ff" stroke-width="1"/>
  <!-- selected vertex -->
  <circle cx="100" cy="150" r="7" fill="#ff8800" stroke="#ff5500" stroke-width="2"/>
  <!-- line feature -->
  <line x1="30" y1="180" x2="170" y2="180" stroke="#3388ff" stroke-width="3" stroke-dasharray=""/>
  <!-- points -->
  <circle cx="30" cy="180" r="6" fill="#3388ff" stroke="#ffffff" stroke-width="1"/>
  <circle cx="170" cy="180" r="6" fill="#3388ff" stroke="#ffffff" stroke-width="1"/>
</svg>
