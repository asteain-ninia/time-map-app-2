<svg xmlns="http://www.w3.org/2000/svg" width="140" height="60">
  <!-- point -->
  <circle cx="20" cy="20" r="4" fill="#3388ff" stroke="#000" stroke-width="1" />
  <circle cx="20" cy="20" r="7" fill="#00ffff" stroke="#0000ff" stroke-width="3" />

  <!-- line -->
  <line x1="40" y1="20" x2="80" y2="20" stroke="#00aaff" stroke-width="4" />
  <circle cx="40" cy="20" r="4" fill="#3388ff" stroke="#000" stroke-width="1" />
  <circle cx="80" cy="20" r="4" fill="#3388ff" stroke="#000" stroke-width="1" />
  <circle cx="60" cy="20" r="7" fill="#00ffff" stroke="#0000ff" stroke-width="3" />

  <!-- polygon -->
  <polygon points="90,10 120,10 120,40 90,40" fill="none" stroke="#00aaff" stroke-width="4" />
  <circle cx="90" cy="10" r="4" fill="#3388ff" stroke="#000" stroke-width="1" />
  <circle cx="120" cy="10" r="4" fill="#3388ff" stroke="#000" stroke-width="1" />
  <circle cx="120" cy="40" r="7" fill="#00ffff" stroke="#0000ff" stroke-width="3" />
</svg>
