<svg xmlns="http://www.w3.org/2000/svg" width="140" height="60">
  <!-- dragging point -->
  <circle cx="20" cy="20" r="7" fill="#ff00ff" stroke="#ffffff" stroke-width="2" />
  <line x1="20" y1="20" x2="40" y2="20" stroke="#ff00ff" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="40" cy="20" r="3" fill="rgba(0,150,255,0.5)" stroke="rgba(0,100,200,0.7)" stroke-width="1" />

  <!-- polygon preview -->
  <polygon points="70,10 100,10 100,40 70,40" fill="none" stroke="#ff00ff" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="70" cy="10" r="3" fill="#ff00ff" stroke="#ffffff" stroke-width="1" />
  <circle cx="100" cy="10" r="3" fill="#ff00ff" stroke="#ffffff" stroke-width="1" />
  <circle cx="100" cy="40" r="3" fill="#ff00ff" stroke="#ffffff" stroke-width="1" />
</svg>
