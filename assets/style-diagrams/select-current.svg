<svg xmlns="http://www.w3.org/2000/svg" width="140" height="60">
  <!-- point -->
  <circle cx="20" cy="20" r="3" fill="rgba(0,150,255,0.5)" stroke="rgba(0,100,200,0.7)" stroke-width="1" />
  <circle cx="20" cy="20" r="6" fill="#00ffff" stroke="#0000ff" stroke-width="2" />

  <!-- line -->
  <line x1="40" y1="20" x2="80" y2="20" stroke="#00ffff" stroke-width="4" stroke-dasharray="4,4" />
  <circle cx="40" cy="20" r="3" fill="rgba(0,150,255,0.5)" stroke="rgba(0,100,200,0.7)" stroke-width="1" />
  <circle cx="80" cy="20" r="3" fill="rgba(0,150,255,0.5)" stroke="rgba(0,100,200,0.7)" stroke-width="1" />
  <circle cx="60" cy="20" r="6" fill="#00ffff" stroke="#0000ff" stroke-width="2" />

  <!-- polygon -->
  <polygon points="90,10 120,10 120,40 90,40" fill="none" stroke="#00ffff" stroke-width="4" stroke-dasharray="4,4" />
  <circle cx="90" cy="10" r="3" fill="rgba(0,150,255,0.5)" stroke="rgba(0,100,200,0.7)" stroke-width="1" />
  <circle cx="120" cy="10" r="3" fill="rgba(0,150,255,0.5)" stroke="rgba(0,100,200,0.7)" stroke-width="1" />
  <circle cx="120" cy="40" r="6" fill="#00ffff" stroke="#0000ff" stroke-width="2" />
</svg>
